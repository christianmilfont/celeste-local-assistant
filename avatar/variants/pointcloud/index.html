<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Celeste</title>
  <link rel="stylesheet" href="../../avatar.css">
</head>
<!--
  Avatar 2D da Celeste — cabeça flutuante em nuvem de pontos conectados (holograma / scanner 3D).
  Camadas (mesmo enquadramento, viewBox "30 40 340 425"):
    face-cloud.svg (máscara colorida por CSS) + face-highlights.svg — estáticas, rasterizadas uma vez
    → olhos de pontos (brilho por estado, sem piscar) → boca pontilhada (única parte animada, só na fala).
  Sem piscar, sem movimento de cabeça/olhar, sem fluxo de dados: em IDLE a página fica parada.
  Nuvem: .venv/Scripts/python scripts/avatar/generate_pointcloud.py
  Parâmetros: ?bg=transparent  ?hud=0  ?captions=0  ?demo=1  ?state=SPEAKING
  Versão anterior (estilo "Skynet"): /variants/skynet/index.html
-->
<body data-state="IDLE" data-connected="false">
  <main class="stage" aria-label="Celeste">
    <div class="halo" aria-hidden="true"></div>

    <div class="frame">
      <div class="cloud" role="img" aria-label="Rosto da Celeste"></div>
      <img class="highlights" src="../../assets/face-highlights.svg" alt="" aria-hidden="true" draggable="false">
      <div class="eye-glow eye-glow-left" aria-hidden="true"></div>
      <div class="eye-glow eye-glow-right" aria-hidden="true"></div>

      <!-- Olhos: orbes de luz na cor do estado (sem piscar). Gerados por generate_pointcloud.py. -->
      <svg class="layer eyes" viewBox="30 40 340 425" aria-hidden="true">
        <g class="eye-dots"><defs><radialGradient id="orbBody" cx="42%" cy="38%" r="62%"><stop offset="0" class="orb-core"/><stop offset=".5" class="orb-mid"/><stop offset="1" class="orb-edge"/></radialGradient><radialGradient id="orbHalo" cx="50%" cy="50%" r="50%"><stop offset="0" class="orb-halo" stop-opacity=".55"/><stop offset=".45" class="orb-halo" stop-opacity=".16"/><stop offset="1" class="orb-halo" stop-opacity="0"/></radialGradient></defs><ellipse class="orb-halo-shape" cx="158.2" cy="206" rx="16.4" ry="19" fill="url(#orbHalo)"/><ellipse class="orb" cx="158.2" cy="206" rx="6.2" ry="7.2" fill="url(#orbBody)"/><circle class="orb-glint" cx="156.3" cy="203.6" r="1.3"/><ellipse class="orb-halo-shape" cx="235.8" cy="206" rx="20.5" ry="19" fill="url(#orbHalo)"/><ellipse class="orb" cx="235.8" cy="206" rx="7.8" ry="7.2" fill="url(#orbBody)"/><circle class="orb-glint" cx="233.4" cy="203.6" r="1.3"/></g>
      </svg>

      <!-- Boca: linha de pontos que se abre em dois arcos na fala (pontos posicionados pelo avatar.js). -->
      <svg class="layer mouth-layer" viewBox="30 40 340 425" aria-hidden="true">
        <defs>
          <radialGradient id="mouthGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0" class="mouth-glow" stop-opacity=".9"/>
            <stop offset=".6" class="mouth-glow" stop-opacity=".3"/>
            <stop offset="1" class="mouth-glow" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <g class="mouth" transform="translate(192.0 301) scale(0.970 1)">
          <ellipse class="mouth-inner" rx="0" ry="0" fill="url(#mouthGlow)"/>
          <g class="mouth-dots"></g>
        </g>
      </svg>
    </div>

    <div class="vignette" aria-hidden="true"></div>

    <header class="hud">
      <div class="name">CELESTE</div>
      <div class="status"><span class="dot"></span><span class="label">IDLE</span></div>
    </header>
    <p class="caption" aria-live="polite"></p>
  </main>

  <script src="../../lipsync.js"></script>
  <script src="../../avatar.js"></script>
</body>
</html>
