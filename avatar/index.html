<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Celeste</title>
  <link rel="stylesheet" href="hologram.css">
  <!-- Three.js servido localmente pelo AvatarServer (node_modules/three), sem CDN. -->
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<!--
  Avatar da Celeste — holograma facial 3D (Three.js/WebGL): rede de pontos e ligações,
  olhos em aglomerados de partículas, boca pontilhada, bloom, aberração cromática e scanlines.
  A malha vem de assets/face-mesh.json (scripts/avatar/generate_pointcloud.py).
  Parâmetros: ?lite=1 (sem pós-processamento)  ?yaw=20 (ângulo fixo)  ?hud=0  ?captions=0  ?demo=1  ?state=SPEAKING
  Sem WebGL: variants/pointcloud/ (versão SVG). Versão "Skynet": variants/skynet/
-->
<body data-state="IDLE" data-connected="false">
  <main class="stage" aria-label="Celeste"></main>

  <header class="hud">
    <div class="name">CELESTE</div>
    <div class="status"><span class="dot"></span><span class="label">IDLE</span></div>
  </header>
  <p class="caption" aria-live="polite"></p>

  <script src="lipsync.js"></script>
  <script type="module" src="hologram.js"></script>
  <script>
    // Se o WebGL/Three.js não iniciar (módulo não carregou), usa a versão SVG.
    setTimeout(function () {
      if (!window.celesteAvatar) location.replace('variants/pointcloud/' + location.search);
    }, 8000);
  </script>
</body>
</html>
